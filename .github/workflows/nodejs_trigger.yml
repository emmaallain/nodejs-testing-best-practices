on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches: [master]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      unit: ${{ steps.filter.outputs.unit }}
      nestjs: ${{ steps.filter.outputs.nestjs }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            unit:
              - 'example-application/**'
              - 'package.json'
              - 'package-lock.json'
              - 'jest.config.js'
            nestjs:
              - 'recipes/**'
              - 'tsconfig.json'

  build:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.unit == 'true' || needs.changes.outputs.nestjs == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

  test-unit:
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: >
      github.ref == 'refs/heads/dev' &&
      needs.changes.outputs.unit == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm i

      - name: Run unit tests
        run: npm test

  test-nestjs:
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: >
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.nestjs == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm i

      - name: Run NestJS tests
        run: npm run test:nestjs
